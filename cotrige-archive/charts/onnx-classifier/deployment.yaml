apiVersion: apps/v1
kind: Deployment
metadata:
  name: onnx-classifier
  namespace: cotriage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onnx-classifier
  template:
    metadata:
      labels:
        app: onnx-classifier
    spec:
      containers:
        - name: onnx-classifier
          image: crpi-fq916lepz6l0u7gr.cn-guangzhou.personal.cr.aliyuncs.com/pangjian001/onnx-classifier:v0.0.1-202606251354
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 18080
              name: http
          env:
            - name: OMP_NUM_THREADS
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      imagePullSecrets:
        - name: docker-registry-secret
