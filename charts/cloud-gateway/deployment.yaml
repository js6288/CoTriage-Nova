apiVersion: apps/v1
kind: Deployment
metadata: { name: cloud-gateway, namespace: cotriage }
spec:
  replicas: 1
  selector: { matchLabels: { app: cloud-gateway } }
  template:
    metadata: { labels: { app: cloud-gateway } }
    spec:
      containers:
        - name: cloud-gateway
          image: cotriage-nova/cloud-gateway:java25
          imagePullPolicy: Always
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-Xms64m -Xmx256m" }
            - { name: REDIS_ADDR, value: "redis:6379" }
            - { name: SERVER_BASE_URL, value: "http://server:8080" }
            - name: CLOUD_GATEWAY_CONFIG_TOKEN
              valueFrom: { secretKeyRef: { name: cloud-gateway-config-auth, key: token } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-secret, key: MYSQL_PASSWORD } }
            - { name: MYSQL_DSN, value: "cotriage:$(MYSQL_PASSWORD)@tcp(mysql:3306)/cotriage?charset=utf8mb4&parseTime=true&loc=UTC" }
            - name: CLOUD_GATEWAY_CONSUMER
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      imagePullSecrets: [{ name: docker-registry-secret }]
