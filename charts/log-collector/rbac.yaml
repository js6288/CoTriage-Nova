apiVersion: v1
kind: ServiceAccount
metadata:
  name: cotriage-log-collector
  namespace: cotriage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cotriage-log-collector
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cotriage-log-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cotriage-log-collector
subjects:
  - kind: ServiceAccount
    name: cotriage-log-collector
    namespace: cotriage
