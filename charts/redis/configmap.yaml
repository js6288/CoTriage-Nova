apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: cotriage
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    # 开发环境：关闭保护模式，便于集群内访问
    protected-mode no
    # 持久化（AOF）打开，避免 Pod 重启丢光数据（仍不等同生产可用）
    appendonly yes
    appendfsync everysec
    # RDB 也保留一份
    save 900 1
    save 300 10
    save 60 10000
