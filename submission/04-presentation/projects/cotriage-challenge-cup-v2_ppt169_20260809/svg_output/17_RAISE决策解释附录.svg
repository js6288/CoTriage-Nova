<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#F6F8FB"/>
    <circle cx="640" cy="344" r="240" fill="#F59E0B" fill-opacity="0.04"/>
  </g>
  <g id="header">
    <rect x="48" y="34" width="8" height="46" rx="4" fill="#163A5F"/>
    <text x="72" y="66" font-family="Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="700" fill="#163A5F">附录 B：RAISE 单事件决策解释</text>
    <text x="72" y="102" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#60758A">事件价值与系统条件共同决定动作，运维策略提供优先级更高的硬约束</text>
    <rect x="1128" y="42" width="104" height="34" rx="17" fill="#E9EEF3"/>
    <text x="1180" y="65" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#60758A">Q&amp;A  B</text>
  </g>
  <g id="input-factors">
    <rect x="72" y="152" width="244" height="88" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="1.5"/>
    <use data-icon="chunk-filled/circle-exclamation" x="94" y="174" width="40" height="40" fill="#C62828"/>
    <text x="150" y="184" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#163A5F">事件风险</text>
    <text x="150" y="214" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#60758A">潜在业务影响与优先级</text>
    <line x1="316" y1="196" x2="500" y2="296" stroke="#C62828" stroke-width="3"/>
    <polygon points="492,286 510,302 486,300" fill="#C62828"/>

    <rect x="72" y="310" width="244" height="88" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="1.5"/>
    <use data-icon="chunk-filled/eye" x="94" y="332" width="40" height="40" fill="#16A6B6"/>
    <text x="150" y="342" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#163A5F">诊断不确定性</text>
    <text x="150" y="372" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#60758A">边缘判断是否足够可靠</text>
    <line x1="316" y1="354" x2="478" y2="354" stroke="#16A6B6" stroke-width="3"/>
    <polygon points="478,346 496,354 478,362" fill="#16A6B6"/>

    <rect x="964" y="152" width="244" height="88" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="1.5"/>
    <use data-icon="chunk-filled/wifi-slash" x="986" y="174" width="40" height="40" fill="#60758A"/>
    <text x="1042" y="184" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#163A5F">网络与队列</text>
    <text x="1042" y="214" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#60758A">可用性、云压力与拥塞</text>
    <line x1="964" y1="196" x2="780" y2="296" stroke="#60758A" stroke-width="3"/>
    <polygon points="794,286 770,302 788,300" fill="#60758A"/>

    <rect x="964" y="310" width="244" height="88" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="1.5"/>
    <use data-icon="chunk-filled/chart-line" x="986" y="332" width="40" height="40" fill="#F59E0B"/>
    <text x="1042" y="342" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#163A5F">调用预算</text>
    <text x="1042" y="372" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#60758A">当前窗口可用云端额度</text>
    <line x1="964" y1="354" x2="802" y2="354" stroke="#F59E0B" stroke-width="3"/>
    <polygon points="802,346 784,354 802,362" fill="#F59E0B"/>

    <rect x="518" y="138" width="244" height="78" rx="16" fill="#163A5F"/>
    <use data-icon="chunk-filled/shield-check" x="542" y="157" width="38" height="38" fill="#FFFFFF"/>
    <text x="594" y="169" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">运维策略</text>
    <text x="594" y="196" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF">强制本地 / 禁止上云 / 强制云端</text>
    <line x1="640" y1="216" x2="640" y2="267" stroke="#163A5F" stroke-width="4"/>
    <polygon points="631,267 640,285 649,267" fill="#163A5F"/>
  </g>
  <g id="raise-hub">
    <circle cx="640" cy="354" r="116" fill="#F59E0B"/>
    <circle cx="640" cy="354" r="92" fill="#FFFFFF"/>
    <use data-icon="chunk-filled/route" x="608" y="294" width="64" height="64" fill="#F59E0B"/>
    <text x="640" y="388" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#163A5F">RAISE</text>
    <text x="640" y="417" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#60758A">动态门槛与动作解释</text>
  </g>
  <g id="actions">
    <line x1="640" y1="470" x2="640" y2="500" stroke="#CBD7E3" stroke-width="4"/>
    <line x1="246" y1="500" x2="1034" y2="500" stroke="#CBD7E3" stroke-width="4"/>
    <line x1="246" y1="500" x2="246" y2="522" stroke="#16A6B6" stroke-width="4"/>
    <line x1="640" y1="500" x2="640" y2="522" stroke="#F59E0B" stroke-width="4"/>
    <line x1="1034" y1="500" x2="1034" y2="522" stroke="#60758A" stroke-width="4"/>
    <rect x="104" y="522" width="284" height="108" rx="18" fill="#16A6B6"/>
    <text x="246" y="559" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">LOCAL</text>
    <text x="246" y="589" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">事件价值有限或边缘判断已足够</text>
    <text x="246" y="613" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF">就地返回并继续实时主链</text>
    <rect x="498" y="522" width="284" height="108" rx="18" fill="#F59E0B"/>
    <text x="640" y="559" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">CLOUD</text>
    <text x="640" y="589" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">事件价值高且运行条件允许</text>
    <text x="640" y="613" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF">进入上下文聚合与云端深诊</text>
    <rect x="892" y="522" width="284" height="108" rx="18" fill="#60758A"/>
    <text x="1034" y="559" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">DEFER</text>
    <text x="1034" y="589" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">值得深诊但此刻不宜发送</text>
    <text x="1034" y="613" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF">持久化入 Outbox 等待补传</text>
  </g>
  <g id="footer">
    <line x1="48" y1="680" x2="1232" y2="680" stroke="#CBD7E3" stroke-width="1"/>
    <text x="48" y="704" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#60758A">问答附录 B</text>
    <text x="1232" y="704" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#60758A">17</text>
  </g>
</svg>
