<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#F6F8FB"/>
    <circle cx="1090" cy="510" r="210" fill="#F59E0B" fill-opacity="0.05"/>
  </g>
  <g id="header">
    <rect x="48" y="38" width="8" height="46" rx="4" fill="#F59E0B"/>
    <text x="72" y="70" font-family="Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="700" fill="#163A5F">功能四：DEFER 与 Outbox 解耦弱网和实时主链</text>
    <text x="72" y="108" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#60758A">现场先完成边缘处理；暂不适合上云的事件持久化延期，条件恢复后再有序补传</text>
    <text x="1232" y="68" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#F59E0B">06  RESILIENCE</text>
  </g>
  <g id="realtime-lane">
    <rect x="48" y="144" width="1184" height="162" rx="18" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="1.5"/>
    <rect x="48" y="144" width="128" height="162" rx="18" fill="#163A5F"/>
    <rect x="158" y="144" width="18" height="162" fill="#163A5F"/>
    <text x="112" y="207" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">实时主链</text>
    <text x="112" y="238" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF">不等待云端</text>
    <circle cx="244" cy="225" r="34" fill="#E9EEF3" stroke="#16A6B6" stroke-width="3"/>
    <use data-icon="chunk-filled/file" x="225" y="206" width="38" height="38" fill="#16A6B6"/>
    <text x="244" y="278" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#1D2F42">统一事件</text>
    <line x1="278" y1="225" x2="428" y2="225" stroke="#16A6B6" stroke-width="5"/>
    <polygon points="428,215 448,225 428,235" fill="#16A6B6"/>
    <rect x="448" y="184" width="224" height="82" rx="16" fill="#16A6B6"/>
    <use data-icon="chunk-filled/layers" x="468" y="207" width="36" height="36" fill="#FFFFFF"/>
    <text x="520" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">边缘分层推理</text>
    <text x="520" y="244" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF">规则 / 模板 / 模型</text>
    <line x1="672" y1="225" x2="822" y2="225" stroke="#16A6B6" stroke-width="5"/>
    <polygon points="822,215 842,225 822,235" fill="#16A6B6"/>
    <rect x="842" y="184" width="236" height="82" rx="16" fill="#163A5F"/>
    <use data-icon="chunk-filled/chart-line" x="864" y="207" width="36" height="36" fill="#FFFFFF"/>
    <text x="916" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">本地结果与告警</text>
    <text x="916" y="244" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF">即时展示并继续处理</text>
    <line x1="1078" y1="225" x2="1152" y2="225" stroke="#16A6B6" stroke-width="5"/>
    <polygon points="1152,215 1172,225 1152,235" fill="#16A6B6"/>
  </g>
  <g id="defer-branch">
    <line x1="560" y1="266" x2="560" y2="354" stroke="#F59E0B" stroke-width="4"/>
    <polygon points="550,354 560,374 570,354" fill="#F59E0B"/>
    <rect x="486" y="315" width="148" height="32" rx="16" fill="#F59E0B"/>
    <text x="560" y="337" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">RAISE: DEFER</text>
  </g>
  <g id="outbox-flow">
    <rect x="48" y="374" width="1184" height="242" rx="18" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="1.5"/>
    <text x="72" y="408" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#60758A">Outbox 可恢复传输通道</text>
    <rect x="72" y="438" width="190" height="104" rx="16" fill="#163A5F"/>
    <use data-icon="chunk-filled/database" x="91" y="458" width="34" height="34" fill="#FFFFFF"/>
    <text x="139" y="474" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">1  持久化入队</text>
    <text x="91" y="516" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF">事件与上下文不丢失</text>
    <line x1="262" y1="490" x2="292" y2="490" stroke="#F59E0B" stroke-width="4"/><polygon points="292,482 308,490 292,498" fill="#F59E0B"/>
    <rect x="308" y="438" width="190" height="104" rx="16" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <use data-icon="chunk-filled/route" x="327" y="458" width="34" height="34" fill="#F59E0B"/>
    <text x="375" y="474" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#163A5F">2  优先读取</text>
    <text x="327" y="516" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#60758A">高风险与到期事件优先</text>
    <line x1="498" y1="490" x2="528" y2="490" stroke="#F59E0B" stroke-width="4"/><polygon points="528,482 544,490 528,498" fill="#F59E0B"/>
    <rect x="544" y="438" width="190" height="104" rx="16" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <use data-icon="chunk-filled/clock" x="563" y="458" width="34" height="34" fill="#F59E0B"/>
    <text x="611" y="474" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#163A5F">3  到期重试</text>
    <text x="563" y="516" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#60758A">退避调度并限制次数</text>
    <line x1="734" y1="490" x2="764" y2="490" stroke="#F59E0B" stroke-width="4"/><polygon points="764,482 780,490 764,498" fill="#F59E0B"/>
    <rect x="780" y="438" width="190" height="104" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="2"/>
    <use data-icon="chunk-filled/eye" x="799" y="458" width="34" height="34" fill="#60758A"/>
    <text x="847" y="474" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#163A5F">4  失败留痕</text>
    <text x="799" y="516" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#60758A">状态与错误原因可追踪</text>
    <line x1="970" y1="490" x2="1000" y2="490" stroke="#60758A" stroke-width="4"/><polygon points="1000,482 1016,490 1000,498" fill="#60758A"/>
    <rect x="1016" y="438" width="190" height="104" rx="16" fill="#FFFFFF" stroke="#C62828" stroke-width="2"/>
    <use data-icon="chunk-filled/circle-exclamation" x="1035" y="458" width="34" height="34" fill="#C62828"/>
    <text x="1083" y="474" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#163A5F">5  死信处理</text>
    <text x="1035" y="516" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#60758A">人工复核或再次处置</text>
    <rect x="426" y="562" width="428" height="34" rx="17" fill="#E9EEF3"/>
    <use data-icon="chunk-filled/wifi-slash" x="444" y="570" width="18" height="18" fill="#60758A"/>
    <text x="476" y="585" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#60758A">网络与预算条件允许后，再尝试云端传输</text>
  </g>
  <g id="boundary-note">
    <text x="640" y="648" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#60758A">本页说明工程机制，不据此推断具体恢复率或积压清空时间</text>
  </g>
  <g id="footer">
    <line x1="48" y1="680" x2="1232" y2="680" stroke="#CBD7E3" stroke-width="1"/>
    <text x="48" y="704" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#60758A">弱网自治与延期补传</text>
    <text x="1232" y="704" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#60758A">09</text>
  </g>
</svg>
