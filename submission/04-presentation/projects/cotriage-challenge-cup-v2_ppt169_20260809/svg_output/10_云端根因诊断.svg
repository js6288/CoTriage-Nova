<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#F6F8FB"/>
  </g>
  <g id="header">
    <rect x="48" y="36" width="8" height="46" rx="4" fill="#16A6B6"/>
    <text x="72" y="68" font-family="Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="700" fill="#163A5F">功能五：云端聚合上下文，输出结构化根因与建议</text>
    <text x="72" y="105" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#60758A">高价值事件获得跨节点关联与深度解释，并将可复用知识反馈回系统</text>
    <text x="1232" y="64" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#16A6B6">07  CLOUD AI</text>
  </g>
  <g id="overview-panel">
    <rect x="48" y="130" width="716" height="240" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="1.5"/>
    <text x="68" y="158" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#163A5F">异常诊断中心全景</text>
    <image x="60" y="168" width="692" height="190" xlink:href="../images/s-03b-anomaly-diagnosis-center-overview.png" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="cloud-pipeline">
    <rect x="788" y="130" width="444" height="240" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="1.5"/>
    <text x="810" y="158" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#60758A">云端处理链</text>
    <rect x="810" y="176" width="400" height="38" rx="10" fill="#163A5F"/>
    <text x="832" y="201" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1  关联同源、同窗与相邻节点上下文</text>
    <line x1="1010" y1="214" x2="1010" y2="226" stroke="#16A6B6" stroke-width="3"/><polygon points="1004,226 1010,238 1016,226" fill="#16A6B6"/>
    <rect x="810" y="238" width="400" height="38" rx="10" fill="#16A6B6"/>
    <text x="832" y="263" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2  脱敏并组织诊断提示上下文</text>
    <line x1="1010" y1="276" x2="1010" y2="288" stroke="#F59E0B" stroke-width="3"/><polygon points="1004,288 1010,300 1016,288" fill="#F59E0B"/>
    <rect x="810" y="300" width="190" height="44" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="905" y="328" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#163A5F">3  结构化深诊</text>
    <rect x="1020" y="300" width="190" height="44" rx="10" fill="#FFFFFF" stroke="#16A6B6" stroke-width="2"/>
    <text x="1115" y="328" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#163A5F">4  结果与反馈写回</text>
  </g>
  <g id="diagnosis-detail">
    <rect x="48" y="390" width="1184" height="250" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="1.5"/>
    <text x="70" y="418" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#163A5F">单次云端根因诊断详情</text>
    <image x="60" y="430" width="1160" height="184" xlink:href="../images/s-05a-cloud-root-cause-diagnosis.png" preserveAspectRatio="xMidYMid meet"/>
    <text x="640" y="629" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#60758A">界面展示根因、建议、解释、置信度、时延与 Token；不同阶段字段不用于推断分类准确率</text>
  </g>
  <g id="footer">
    <line x1="48" y1="680" x2="1232" y2="680" stroke="#CBD7E3" stroke-width="1"/>
    <text x="48" y="704" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#60758A">云端诊断与反馈</text>
    <text x="1232" y="704" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#60758A">10</text>
  </g>
</svg>
