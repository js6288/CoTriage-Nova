<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#F6F8FB"/>
    <circle cx="1190" cy="82" r="120" fill="#F59E0B" fill-opacity="0.06"/>
  </g>
  <g id="header">
    <rect x="48" y="34" width="8" height="46" rx="4" fill="#F59E0B"/>
    <text x="72" y="66" font-family="Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="700" fill="#163A5F">功能三：RAISE 为每条事件动态选择计算位置</text>
    <text x="72" y="101" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#60758A">路由不只看置信度，而是联合现场资源、业务风险与诊断不确定性</text>
    <text x="1232" y="62" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#F59E0B">06  ROUTING</text>
  </g>
  <g id="decision-chain">
    <rect x="94" y="118" width="112" height="32" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="1.5"/>
    <text x="150" y="140" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#163A5F">网络状态</text>
    <rect x="218" y="118" width="112" height="32" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="1.5"/>
    <text x="274" y="140" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#163A5F">调用预算</text>
    <rect x="342" y="118" width="112" height="32" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="1.5"/>
    <text x="398" y="140" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#163A5F">事件风险</text>
    <rect x="466" y="118" width="128" height="32" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="1.5"/>
    <text x="530" y="140" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#163A5F">诊断不确定性</text>
    <line x1="610" y1="134" x2="684" y2="134" stroke="#F59E0B" stroke-width="4"/>
    <polygon points="684,126 700,134 684,142" fill="#F59E0B"/>
    <rect x="714" y="114" width="112" height="40" rx="20" fill="#16A6B6"/>
    <text x="770" y="140" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">LOCAL</text>
    <rect x="840" y="114" width="112" height="40" rx="20" fill="#F59E0B"/>
    <text x="896" y="140" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">CLOUD</text>
    <rect x="966" y="114" width="112" height="40" rx="20" fill="#60758A"/>
    <text x="1022" y="140" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">DEFER</text>
    <rect x="1092" y="118" width="94" height="32" rx="16" fill="#E9EEF3"/>
    <text x="1139" y="140" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#60758A">可解释</text>
  </g>
  <g id="raise-frame">
    <rect x="82" y="168" width="1116" height="500" rx="18" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="2"/>
    <image x="94" y="180" width="1092" height="476" xlink:href="../images/s-04a-raise-routing-status-overview.png" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="footer">
    <line x1="48" y1="684" x2="1232" y2="684" stroke="#CBD7E3" stroke-width="1"/>
    <text x="48" y="706" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#60758A">RAISE 动态路由</text>
    <text x="1232" y="706" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#60758A">08</text>
  </g>
</svg>
