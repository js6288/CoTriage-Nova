<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#F6F8FB"/>
  </g>
  <g id="header">
    <rect x="48" y="34" width="8" height="46" rx="4" fill="#163A5F"/>
    <text x="72" y="66" font-family="Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="700" fill="#163A5F">附录 A：赛事指标定义与统计口径</text>
    <text x="72" y="102" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#60758A">统计对象、起止点、时间窗口和分母一致，指标才具备可比的解释意义</text>
    <rect x="1128" y="42" width="104" height="34" rx="17" fill="#E9EEF3"/>
    <text x="1180" y="65" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#60758A">Q&amp;A  A</text>
  </g>
  <g id="metrics-table">
    <rect x="48" y="126" width="1184" height="510" rx="14" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="1.5"/>
    <rect x="48" y="126" width="1184" height="54" rx="14" fill="#163A5F"/>
    <rect x="48" y="164" width="1184" height="16" fill="#163A5F"/>
    <text x="70" y="160" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">指标类别</text>
    <text x="242" y="160" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">回答的问题</text>
    <text x="532" y="160" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">建议统计口径</text>
    <text x="908" y="160" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">阅读边界</text>
    <line x1="220" y1="126" x2="220" y2="636" stroke="#CBD7E3" stroke-width="1"/>
    <line x1="510" y1="126" x2="510" y2="636" stroke="#CBD7E3" stroke-width="1"/>
    <line x1="886" y1="126" x2="886" y2="636" stroke="#CBD7E3" stroke-width="1"/>

    <rect x="48" y="180" width="1184" height="76" fill="#FFFFFF"/>
    <text x="70" y="211" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#163A5F">平均端到端时延</text>
    <text x="242" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1D2F42"><tspan x="242" dy="0">一次处理链路的</tspan><tspan x="242" dy="22">总体时间水平</tspan></text>
    <text x="532" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1D2F42"><tspan x="532" dy="0">明确起点、终点与场景；对所有</tspan><tspan x="532" dy="22">有效事件时延求算术平均</tspan></text>
    <text x="908" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#60758A"><tspan x="908" dy="0">不能由 P95 或 TTFT</tspan><tspan x="908" dy="22">替代</tspan></text>
    <line x1="48" y1="256" x2="1232" y2="256" stroke="#CBD7E3" stroke-width="1"/>

    <rect x="48" y="257" width="1184" height="76" fill="#F6F8FB"/>
    <text x="70" y="288" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#163A5F">P95 时延</text>
    <text x="242" y="282" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1D2F42"><tspan x="242" dy="0">较慢一侧的长尾</tspan><tspan x="242" dy="22">体验是否可控</tspan></text>
    <text x="532" y="282" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1D2F42"><tspan x="532" dy="0">同一窗口内有效时延排序后</tspan><tspan x="532" dy="22">取 95% 分位点</tspan></text>
    <text x="908" y="282" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#60758A"><tspan x="908" dy="0">描述长尾，不代表平均</tspan><tspan x="908" dy="22">处理水平</tspan></text>
    <line x1="48" y1="333" x2="1232" y2="333" stroke="#CBD7E3" stroke-width="1"/>

    <rect x="48" y="334" width="1184" height="76" fill="#FFFFFF"/>
    <text x="70" y="365" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#163A5F">TTFT</text>
    <text x="242" y="359" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1D2F42"><tspan x="242" dy="0">云端开始返回内容前</tspan><tspan x="242" dy="22">需要等待多久</tspan></text>
    <text x="532" y="359" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1D2F42"><tspan x="532" dy="0">从云请求发出到收到首个</tspan><tspan x="532" dy="22">有效响应片段</tspan></text>
    <text x="908" y="359" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#60758A"><tspan x="908" dy="0">不等于完整诊断耗时或</tspan><tspan x="908" dy="22">端到端时延</tspan></text>
    <line x1="48" y1="410" x2="1232" y2="410" stroke="#CBD7E3" stroke-width="1"/>

    <rect x="48" y="411" width="1184" height="76" fill="#F6F8FB"/>
    <text x="70" y="442" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#163A5F">业务功能保持率</text>
    <text x="242" y="436" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1D2F42"><tspan x="242" dy="0">弱网条件下基本任务</tspan><tspan x="242" dy="22">能否继续完成</tspan></text>
    <text x="532" y="436" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1D2F42"><tspan x="532" dy="0">成功完成的基本任务数 ÷</tspan><tspan x="532" dy="22">符合场景的任务总数</tspan></text>
    <text x="908" y="436" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#60758A"><tspan x="908" dy="0">须预先定义网络条件与</tspan><tspan x="908" dy="22">“功能可用”标准</tspan></text>
    <line x1="48" y1="487" x2="1232" y2="487" stroke="#CBD7E3" stroke-width="1"/>

    <rect x="48" y="488" width="1184" height="72" fill="#FFFFFF"/>
    <text x="70" y="519" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#163A5F">决策冲突率</text>
    <text x="242" y="513" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1D2F42"><tspan x="242" dy="0">关联节点之间是否出现</tspan><tspan x="242" dy="22">互相矛盾的判断</tspan></text>
    <text x="532" y="513" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1D2F42"><tspan x="532" dy="0">冲突的可关联任务数 ÷</tspan><tspan x="532" dy="22">全部可关联任务数</tspan></text>
    <text x="908" y="513" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#60758A"><tspan x="908" dy="0">必须先定义关联条件与</tspan><tspan x="908" dy="22">冲突判定规则</tspan></text>
    <line x1="48" y1="560" x2="1232" y2="560" stroke="#CBD7E3" stroke-width="1"/>

    <rect x="48" y="561" width="1184" height="75" fill="#F6F8FB"/>
    <text x="70" y="592" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#163A5F">冲突解决率</text>
    <text x="242" y="586" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1D2F42"><tspan x="242" dy="0">已发生冲突是否被</tspan><tspan x="242" dy="22">成功协调</tspan></text>
    <text x="532" y="586" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1D2F42"><tspan x="532" dy="0">成功解决的冲突数 ÷</tspan><tspan x="532" dy="22">全部已发生冲突数</tspan></text>
    <text x="908" y="586" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#60758A"><tspan x="908" dy="0">分母为零时应标记为</tspan><tspan x="908" dy="22">无可判断样本</tspan></text>
  </g>
  <g id="footer">
    <line x1="48" y1="680" x2="1232" y2="680" stroke="#CBD7E3" stroke-width="1"/>
    <text x="48" y="704" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#60758A">问答附录 A</text>
    <text x="1232" y="704" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#60758A">16</text>
  </g>
</svg>
