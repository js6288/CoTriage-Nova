    claim: 各路由方法的故障识别与诊断质量
    metric: Macro-F1、高风险 Recall、根因评价
    definition: 各方法使用相同数据划分和标注口径
    unit: ratio
    aggregation: 按场景报告均值、误差和样本数
    required_files:
      - experiment_bundle/raw/method_predictions.csv
      - experiment_bundle/summary/quality_summary.csv
