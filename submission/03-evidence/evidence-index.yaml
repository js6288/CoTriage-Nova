# CoTriage 参赛材料统一证据索引。
#
# status 仅允许：
# - verified_local：已通过当前仓库代码或文档核对；
# - pending_external：等待开发/实验负责人提供原始数据或截图；
# - verified_external：外部证据已完成文件、口径与结果核验。
#
# 报告、工程文档和 PPT 必须复用这里的 id。任何量化结论只有在
# status=verified_external 后才能写入对外材料。

