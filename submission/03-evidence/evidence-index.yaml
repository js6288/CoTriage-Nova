    metric: 本地有效决策率、任务成功率、补传成功率、恢复时间
    definition: 提供 RTT、丢包、断网和恢复时间轴，并与事件及 Outbox 记录对齐
    unit: ratio_and_seconds
    aggregation: 按网络阶段和重复轮次统计
    required_files:
      - experiment_bundle/raw/network_trace.csv
      - experiment_bundle/raw/outbox_events.csv
      - experiment_bundle/summary/weak_network_summary.csv
    owner: 开发与实验负责人
    status: pending_external

  - id: EVID-EXP-RELIABILITY-01
    claim: 故障与重试条件下消息处理保持可靠
    metric: 成功率、重复率、DLQ 数、恢复时间
    definition: 对 Redis、MySQL、Provider 和进程故障分别注入并记录事件状态
    unit: mixed
    aggregation: 按故障类型统计
    required_files:
      - experiment_bundle/raw/fault_injection_events.csv
      - experiment_bundle/summary/reliability_summary.csv
    owner: 开发与实验负责人
    status: pending_external

  - id: EVID-EXP-CONSISTENCY-01
