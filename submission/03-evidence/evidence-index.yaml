  - id: EVID-EXP-CAPABILITY-01
    claim: 边缘模型在统一任务上的能力保持情况
    metric: 能力保持率、Accuracy、Precision、Recall、F1、Macro-F1
    definition: 教师与边缘模型必须使用同一测试样本、标签和评分脚本
    unit: ratio
    aggregation: 报告样本数、均值、标准差和置信区间
    required_files:
      - experiment_bundle/raw/model_predictions.csv
      - experiment_bundle/summary/model_quality.csv
      - experiment_bundle/configs/model.yaml
    owner: 开发与实验负责人
    status: pending_external

  - id: EVID-EXP-MEMORY-01
    claim: 单次边缘推理的资源占用
    metric: 峰值 RSS、CPU、模型文件大小、吞吐
    definition: 区分模型加载、预热和稳态推理阶段，记录采样工具与间隔
    unit: mixed
    aggregation: 报告峰值与稳态统计
    required_files:
      - experiment_bundle/raw/resource_samples.csv
      - experiment_bundle/summary/resource_summary.csv
    owner: 开发与实验负责人
    status: pending_external

  - id: EVID-EXP-LATENCY-01
    claim: CoTriage 的首次有效决策与完整诊断时延
    metric: P50、P95、P99、TTFT
    definition: 分开记录边缘首次有效决策和异步云端完整诊断，所有节点说明时钟口径
    unit: ms
    aggregation: 按方法、场景和网络条件分别统计
    required_files:
      - experiment_bundle/raw/latency_events.csv
      - experiment_bundle/summary/latency_summary.csv
    owner: 开发与实验负责人
    status: pending_external

