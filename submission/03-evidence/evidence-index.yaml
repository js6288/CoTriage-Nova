    definition: 按同一事件集合比较各方法，说明请求重试是否计入
    unit: mixed
    aggregation: 总量与每事件均值
    required_files:
      - experiment_bundle/raw/cloud_requests.csv
      - experiment_bundle/summary/communication_summary.csv
    owner: 开发与实验负责人
